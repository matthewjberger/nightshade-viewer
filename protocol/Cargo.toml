[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
enum2schema = { version = "0.1", optional = true }

[features]
# The external agent protocol (Claude Code via the MCP bridge). Off by default
# so the plain viewer build carries none of it.
agent = ["dep:serde_json", "dep:enum2schema"]
