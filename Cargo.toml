[workspace]
members = ["desktop", "protocol", "worker"]
resolver = "2"

[package]
name = "nightshade-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
protocol = { path = "protocol" }
wasm-bindgen = "=0.2.115"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde_json = { version = "1", optional = true }
console_error_panic_hook = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "OffscreenCanvas",
    "CssStyleDeclaration",
    "DomRect",
    "DomRectReadOnly",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "WebSocket",
    "MessageEvent",
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
    "PointerEvent",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "DragEvent",
    "DataTransfer",
    "File",
    "FileList",
    "Blob",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Performance",
    "Storage",
] }

[features]
# The external agent relay (page <-> MCP bridge websocket). Off by default so a
# deployed build never opens a localhost socket; enable for agent development.
agent = ["protocol/agent", "dep:serde_json"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
