[workspace]

[package]
name = "host"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nightshade-mcp"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
enum2schema = "0.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "net",
    "sync",
    "time",
] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
